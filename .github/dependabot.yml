version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Keep the library's declared compatibility bounds under deliberate review.
    versioning-strategy: "lockfile-only"
    groups:
      python-dependencies:
        patterns: ["*"]
