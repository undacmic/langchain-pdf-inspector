name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"

      - name: Install runtime + dev dependencies
        run: uv sync --group dev --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy src

  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"

      - name: Install runtime + dev dependencies
        run: uv sync --group dev --locked

      - name: Install TeX Live (for PDF fixtures)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Build PDF test fixtures
        run: uv run python tests/fixtures/build_fixtures.py

      - name: Run tests
        run: uv run pytest

  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-pdf-inspector
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
