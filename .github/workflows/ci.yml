name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, format, type-check & test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install runtime + dev dependencies
        run: uv sync --group dev --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Verify checked-in PDF fixtures (no TeX required)
        run: uv run python tests/fixtures/build_fixtures.py --check

      - name: Run tests (real fixtures, no missing-fixture skips)
        run: uv run pytest

  build:
    name: Build & check distributions (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Build sdist & wheel
        run: uv build

      - name: Check distribution contents
        run: python3 tests/check_distribution.py
