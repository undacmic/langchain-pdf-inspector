[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-pdf-inspector"
dynamic = ["version"]
description = "A LangChain document loader and blob parser for PDF files, built on the pdf-inspector library."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.5.3,<2",
    "pdf-inspector>=1.25.2,<2",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/undacmic/langchain-pdf-inspector"
Repository = "https://github.com/undacmic/langchain-pdf-inspector"
Issues = "https://github.com/undacmic/langchain-pdf-inspector/issues"
Releases = "https://github.com/undacmic/langchain-pdf-inspector/releases"

[tool.hatch.version]
path = "src/langchain_pdf_inspector/__init__.py"

[tool.hatch.metadata]
license-files = ["LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_pdf_inspector"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "/.github",
  "/.devcontainer",
  "/.agents",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src"]
markers = [
    "requires(package): skip the test unless the optional package `package` is importable",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.9",
]
