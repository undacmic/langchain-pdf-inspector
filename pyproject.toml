[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-pdf-inspector"
dynamic = ["version"]
description = "A LangChain document loader and blob parser for PDF files, built on the pdf-inspector library."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langchain-core==1.5.3",
    "pdf-inspector==0.2.6",
    "requests>=2.31",
]

[tool.hatch.version]
path = "src/langchain_pdf_inspector/__init__.py"

[tool.hatch.metadata]
license-files = ["LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_pdf_inspector"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "/.github",
  "/.devcontainer",
  "/.agents",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src"]
markers = [
    "requires(package): skip the test unless the optional package `package` is importable",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.9",
]
